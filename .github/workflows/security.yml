name: Security Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: python -m pip install "detect-secrets==1.5.0"
      - name: Scan repository for secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - name: Scan full Git history with Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.24.2
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --log-opts="--all"
